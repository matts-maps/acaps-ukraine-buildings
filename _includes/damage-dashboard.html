<link rel="stylesheet" href="{{ '/assets/css/unified-dashboard.css' | relative_url }}">

<div class="dashboard-container">

  <div id="error-msg"></div>

  <div id="controls">
    <div class="control-row">

      <div class="control-group year-checkbox-group">
        <label>Years to compare:</label>
        <div id="year-checkboxes" class="year-checkbox-row"></div>
      </div>

      <div class="control-group">
        <label for="infra-type-select">Building type:</label>
        <select id="infra-type-select" onchange="updateChartAndStats()">
          <option value="">All building types</option>
        </select>
      </div>
    </div>

    <div class="control-row">
      <div class="control-group">
        <label for="highlight-start">Highlighted period from:</label>
        <input type="date" id="highlight-start" onchange="updateChartAndStats()">
      </div>
      <div class="control-group">
        <label for="highlight-end">to:</label>
        <input type="date" id="highlight-end" onchange="updateChartAndStats()">
      </div>

      <div class="control-group">
        <label for="period-type">Data aggregation:</label>
        <select id="period-type" onchange="typeof buildPeriodDropdowns === 'function' && buildPeriodDropdowns(); typeof updateChartAndStats === 'function' && updateChartAndStats();">
          <option value="7">Weekly</option>
          <option value="14" selected>Fortnightly</option>
          <option value="30">Monthly</option>
        </select>
      </div>
    </div>
  </div>

  <div id="chart-card">
    <div class="chart-header">
      <div>
        <h2 id="chart-title">Timeline - Total number of damaged buildings</h2>
        <div class="subtitle" id="chart-subtitle"></div>
      </div>
      <div class="export-buttons">
        <span class="export-label">Export:</span>
        <button type="button" onclick="exportChart('png')">PNG</button>
        <button type="button" onclick="exportChart('jpg')">JPG</button>
        <button type="button" onclick="exportChart('svg')">SVG</button>
      </div>
    </div>
    <div id="chart-wrapper">
      <canvas id="myChart"></canvas>
    </div>
  </div>

  <div id="stats"></div>

</div>

<script>
  window.DASHBOARD_CSV_PATH = "{{ '/data/ukraine-damages.csv' | relative_url }}";
</script>
<script src="{{ '/assets/js/damage-dashboard.js' | relative_url }}"></script>
