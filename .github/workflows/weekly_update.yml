name: Update Ukraine Damages

on:
  schedule:
    # Runs daily at 00:00 UTC (was previously Mondays only).
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Run updater
        env:
          ACAPS_API_TOKEN: ${{ secrets.ACAPS_API_TOKEN }}
        run: python scripts/update.py

      - name: Run summariser
        run: python scripts/summarise.py

      - name: Run Oblast / Raion summaries (CSV + Shapefile, by building type)
        run: python scripts/summarise_admin.py

      - name: Commit changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage raw data, summaries, static charts, and the automated dashboard interface
          git add data/ukraine-damages.csv \
                  data/ukraine-damages-weekly-summary.csv \
                  data/damage-summary-oblast.csv \
                  data/damage-summary-raion.csv \
                  data/damage-summary-oblast-shapefile.zip \
                  data/damage-summary-raion-shapefile.zip \
                  index.html

          if git diff --cached --quiet; then
            echo "No changes detected in raw data, summaries, plots, or dashboard."
          else
            git commit -m "Daily ACAPS updates, Oblast/Raion damage summaries, and dashboard update"

            # Pull any remote changes and rebase our automated commit on top of them
            git pull --rebase origin main

            git push origin main
          fi